name: Trivy container scan

on:
  workflow_call:

jobs:
  scan:
    name: Trivy container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t blazorai:pr-${{ github.event.pull_request.number }} \
            -f BlazorAI/Dockerfile \
            .

      - name: Run Trivy (Generate SARIF for GitHub)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blazorai:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy.sarif
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          ignore-unfixed: true

      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Run Trivy (Show table and block PR)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: blazorai:pr-${{ github.event.pull_request.number }}
          format: table
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true