name: Snyk Dependencies (SCA)

on:
  workflow_call:
    secrets:
      SNYK_TOKEN:
        required: true

jobs:
  scan:
    name: Snyk Dependencies (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ArtificialIntelligence.slnx

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk SCA
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --all-projects --detection-depth=4 \
            --severity-threshold=medium \
            --sarif-file-output=snyk-sca.sarif

      - name: Upload SARIF
        if: always() && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-sca

      - name: Publish snapshot to Snyk dashboard
        if: always()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk monitor --all-projects --detection-depth=4
