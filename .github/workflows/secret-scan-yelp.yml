name: Yelp Detect Secrets

on:
  workflow_call:

jobs:
  scan:
    name: Yelp Detect Secrets
    runs-on: ubuntu-latest
    env:
      DETECT_SECRETS_EXCLUDES: '(^|/)(\.git|bin|obj|\.vs|node_modules)(/|$)'
    steps:
      - uses: actions/checkout@v4

      - name: Remove .git before scanning (avoid false positives on git internals)
        run: rm -rf .git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install "detect-secrets==1.5.0"

      - name: Run scan
        id: scan
        run: |
          if [ -f ".secrets.baseline" ]; then
            echo "Using existing baseline (.secrets.baseline)"
            TMP=$(mktemp)
            # detect-secrets behavior with --baseline varies by version:
            # some print the merged JSON to stdout, others update the
            # baseline file in place and print nothing. Handle both.
            detect-secrets scan --all-files \
              --exclude-files "${DETECT_SECRETS_EXCLUDES}" \
              --baseline .secrets.baseline > "$TMP" || true

            if [ -s "$TMP" ]; then
              echo "detect-secrets printed results to stdout"
              cp "$TMP" detect-secrets-results.json
            else
              echo "detect-secrets updated .secrets.baseline in place; using it as results"
              cp .secrets.baseline detect-secrets-results.json
            fi
          else
            echo "No baseline found; scanning entire repo"
            detect-secrets scan --all-files \
              --exclude-files "${DETECT_SECRETS_EXCLUDES}" \
              . > detect-secrets-results.json
          fi

          # sanity check: fail loudly and early if the results file is not valid JSON,
          # instead of letting the failure surface later as a confusing traceback
          python -c "import json; json.load(open('detect-secrets-results.json'))"

          FOUND=$(python -c "
          import json
          d = json.load(open('detect-secrets-results.json'))
          results = d.get('results', {})
          # count only findings not explicitly marked as false positive in the baseline
          total = sum(
              1 for findings in results.values() for f in findings
              if f.get('is_secret') is not False
          )
          print(total)
          ")
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Findings: $FOUND"

      - name: Job Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          with open("detect-secrets-results.json") as f:
              data = json.load(f)

          results = data.get("results", {})
          total = sum(len(v) for v in results.values())

          lines = [
              "### Detect Secrets summary",
              "",
              f"**Possible secrets found:** {total}",
              "",
          ]

          if results:
              lines.append("**Files with findings:**")
              for file_path, findings in results.items():
                  lines.append(f"- [{len(findings)}] {file_path}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")
          PY

      - name: Convert results to SARIF
        if: always()
        run: |
          python - <<'PY'
          import json

          with open("detect-secrets-results.json") as f:
              data = json.load(f)

          sarif_results = []
          for file_path, findings in data.get("results", {}).items():
              for finding in findings:
                  if finding.get("is_secret") is False:
                      continue
                  sarif_results.append({
                      "ruleId": finding.get("type", "secret"),
                      "level": "error",
                      "message": {"text": f"Possible secret detected: {finding.get('type', 'unknown')}"},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": file_path},
                              "region": {"startLine": finding.get("line_number", 1)}
                          }
                      }]
                  })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "detect-secrets",
                          "informationUri": "https://github.com/Yelp/detect-secrets"
                      }
                  },
                  "results": sarif_results
              }]
          }

          with open("detect-secrets.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          PY

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: detect-secrets.sarif
          category: detect-secrets

      - name: Fail if secrets were found
        if: steps.scan.outputs.found != '0'
        run: |
          echo "::error::detect-secrets found possible secrets in the code."
          exit 1
