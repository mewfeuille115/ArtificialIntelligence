name: Yelp Detect Secrets

on:
  workflow_call:

jobs:
  scan:
    name: Yelp Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run scan
        id: scan
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|[\\/])(\.git|bin|obj|\.vs|node_modules|\.secrets\.baseline|\.github[\\/]workflows[\\/]pr-security-checks\.yml)([\\/]|$)' \
            . > detect-secrets-results.json

          python - <<'PY'
          import json
          import os

          with open("detect-secrets-results.json", "r", encoding="utf-8") as f:
            current = json.load(f)

          baseline_results = {}
          if os.path.exists(".secrets.baseline"):
            with open(".secrets.baseline", "r", encoding="utf-8") as f:
              baseline = json.load(f)
              baseline_results = baseline.get("results", {})

          def finding_key(file_path, finding):
            return (
              file_path,
              finding.get("type"),
              finding.get("line_number"),
              finding.get("hashed_secret"),
            )

          baseline_set = set()
          for file_path, findings in baseline_results.items():
            for finding in findings:
              baseline_set.add(finding_key(file_path, finding))

          new_results = {}
          new_count = 0
          total_count = 0
          for file_path, findings in current.get("results", {}).items():
            valid_findings = []
            for finding in findings:
              if file_path.endswith(".secrets.baseline"):
                continue
              if file_path.endswith(".github/workflows/pr-security-checks.yml"):
                continue
              if finding.get("is_secret") is False:
                continue
              if finding_key(file_path, finding) in baseline_set:
                continue
              valid_findings.append(finding)

            total_count += len(findings)
            if valid_findings:
              new_results[file_path] = valid_findings
              new_count += len(valid_findings)

          filtered = {
            "version": current.get("version"),
            "plugins_used": current.get("plugins_used", []),
            "filters_used": current.get("filters_used", []),
            "results": new_results,
          }

          with open("detect-secrets-new-results.json", "w", encoding="utf-8") as f:
            json.dump(filtered, f, indent=2)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"found_total={total_count}\n")
            out.write(f"found_new={new_count}\n")

          print(f"Total findings: {total_count}")
          print(f"New findings: {new_count}")
          PY

      - name: Convert results to SARIF
        if: always()
        run: |
          python - <<'PY'
          import json

          with open("detect-secrets-new-results.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          sarif_results = []
          for file_path, findings in data.get("results", {}).items():
              for finding in findings:
                  if file_path.endswith(".secrets.baseline"):
                      continue
                  if file_path.endswith(".github/workflows/pr-security-checks.yml"):
                      continue
                  if finding.get("is_secret") is False:
                      continue
                  sarif_results.append({
                      "ruleId": finding.get("type", "secret"),
                      "level": "error",
                      "message": {"text": f"Possible secret detected: {finding.get('type', 'unknown')}"},
                      "locations": [{
                          "physicalLocation": {
                              "artifactLocation": {"uri": file_path},
                              "region": {"startLine": finding.get("line_number", 1)}
                          }
                      }]
                  })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{
                  "tool": {
                      "driver": {
                          "name": "detect-secrets",
                          "informationUri": "https://github.com/Yelp/detect-secrets"
                      }
                  },
                  "results": sarif_results
              }]
          }

          with open("detect-secrets.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          PY

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: detect-secrets.sarif
          category: detect-secrets

      - name: Fail if new secrets were found
        if: steps.scan.outputs.found_new != '0'
        run: |
          echo "::error::detect-secrets found new possible secrets in the code."
          exit 1
